name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Build for GitHub Pages
        run: npx tsc -b && npx vite build --base /JoePDF/

      - name: Verify dist/index.html contains built assets (not source files)
        run: |
          if grep -q "src/main.tsx" dist/index.html; then
            echo "ERROR: dist/index.html still contains dev source path — build may have failed"
            cat dist/index.html
            exit 1
          fi
          echo "Build looks correct:"
          grep -o 'src="[^"]*"' dist/index.html || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
